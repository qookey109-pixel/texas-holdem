name: Poker Economy OODA

on:
  pull_request:
    paths:
      - ".github/workflows/poker-economy-ooda.yml"
      - "tests/e2e/poker-economy-ooda-v1.spec.js"
      - "tests/support/poker-economy-ooda-v1.js"
      - "scripts/check-poker-economy-repro-v1.mjs"
      - "scripts/evaluate-poker-economy-tail-catchup-v1.mjs"
      - "package.json"
  workflow_dispatch:
    inputs:
      stage:
        description: Evidence stage
        required: true
        default: screen
        type: choice
        options:
          - smoke
          - screen
          - deep
          - evidence

permissions:
  contents: read

concurrency:
  group: poker-economy-ooda-${{ github.ref }}-${{ inputs.stage || 'screen' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.plan.outputs.stage }}
      matrix: ${{ steps.plan.outputs.matrix }}
      hands: ${{ steps.plan.outputs.hands }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
    steps:
      - id: plan
        name: Build full-buyin tail catch-up candidate matrix
        shell: bash
        run: |
          stage="${{ inputs.stage || 'screen' }}"
          case "$stage" in
            smoke) hands=25; shards=1 ;;
            screen) hands=100; shards=2 ;;
            deep) hands=250; shards=4 ;;
            evidence) hands=1000; shards=10 ;;
            *) echo "Unknown stage: $stage" >&2; exit 1 ;;
          esac
          matrix=$(node -e '
            const policies = ["80-75", "tail5-fullbuyin", "tail5-budgeted"];
            const shards = Number(process.argv[1]);
            const include = [];
            for (const policy of policies) for (let shard = 0; shard < shards; shard += 1) include.push({ policy, shard });
            process.stdout.write(JSON.stringify({ include }));
          ' "$shards")
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "hands=$hands" >> "$GITHUB_OUTPUT"
          echo "shard_count=$shards" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POKER_ECONOMY_OODA: "1"
      POKER_ECONOMY_OODA_POLICY: "80-75"
      POKER_ECONOMY_OODA_STAGE: "reproducibility"
      POKER_ECONOMY_OODA_HANDS: "100"
      POKER_ECONOMY_OODA_SHARD: "0"
      POKER_ECONOMY_OODA_SHARD_COUNT: "1"
      POKER_ECONOMY_OODA_SEED_BASE: "26890246"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install locked test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run deterministic replay A
        env:
          POKER_ECONOMY_OODA_OUTPUT_DIR: economy-ooda-repro/run-a
        run: >-
          npx playwright test
          tests/e2e/poker-economy-ooda-v1.spec.js
          --project=chromium
          --retries=0

      - name: Run deterministic replay B
        env:
          POKER_ECONOMY_OODA_OUTPUT_DIR: economy-ooda-repro/run-b
        run: >-
          npx playwright test
          tests/e2e/poker-economy-ooda-v1.spec.js
          --project=chromium
          --retries=0

      - name: Compare deterministic fingerprints and economy telemetry
        run: >-
          node scripts/check-poker-economy-repro-v1.mjs
          economy-ooda-repro/run-a/poker-economy-ooda-80-75-shard-000.json
          economy-ooda-repro/run-b/poker-economy-ooda-80-75-shard-000.json
          economy-ooda-repro/reproducibility-summary.json

      - name: Upload reproducibility evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: poker-economy-ooda-reproducibility
          path: economy-ooda-repro/
          if-no-files-found: warn
          retention-days: 30

  evaluate:
    needs:
      - plan
      - reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install locked test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full-hand tail catch-up candidate shard
        env:
          POKER_ECONOMY_OODA: "1"
          POKER_ECONOMY_OODA_POLICY: ${{ matrix.policy }}
          POKER_ECONOMY_OODA_STAGE: ${{ needs.plan.outputs.stage }}
          POKER_ECONOMY_OODA_HANDS: ${{ needs.plan.outputs.hands }}
          POKER_ECONOMY_OODA_SHARD: ${{ matrix.shard }}
          POKER_ECONOMY_OODA_SHARD_COUNT: ${{ needs.plan.outputs.shard_count }}
          POKER_ECONOMY_OODA_SEED_BASE: "26890246"
          POKER_ECONOMY_OODA_OUTPUT_DIR: economy-ooda-results
        run: >-
          npx playwright test
          tests/e2e/poker-economy-ooda-v1.spec.js
          --project=chromium
          --retries=0

      - name: Upload candidate telemetry
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: economy-ooda-${{ matrix.policy }}-${{ matrix.shard }}
          path: economy-ooda-results/
          if-no-files-found: error
          retention-days: 14

  summarize:
    needs:
      - plan
      - evaluate
    if: ${{ always() && needs.evaluate.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download candidate telemetry
        uses: actions/download-artifact@v8
        with:
          pattern: economy-ooda-*
          path: economy-ooda-results
          merge-multiple: false

      - name: Evaluate tail catch-up OODA evidence
        env:
          POKER_ECONOMY_OODA_CANDIDATES: "80-75,tail5-fullbuyin,tail5-budgeted"
        run: node scripts/evaluate-poker-economy-tail-catchup-v1.mjs economy-ooda-results economy-ooda-summary

      - name: Upload OODA summary
        uses: actions/upload-artifact@v7
        with:
          name: poker-economy-ooda-${{ needs.plan.outputs.stage }}-summary
          path: economy-ooda-summary/
          if-no-files-found: error
          retention-days: 30
