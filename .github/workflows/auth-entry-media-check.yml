name: Auth entry vector contract

on:
  pull_request:
    paths:
      - build-manifest.json
      - js/auth-entry-v2.js
      - js/auth-entry-v2.css
      - js/auth-entry-video-trial.css
      - tests/e2e/auth-entry-v2.spec.js
      - tests/e2e/auth-entry-video-playback.spec.js
      - .github/workflows/auth-entry-media-check.yml
  push:
    branches:
      - main
    paths:
      - build-manifest.json
      - js/auth-entry-v2.js
      - js/auth-entry-v2.css
      - js/auth-entry-video-trial.css
      - tests/e2e/auth-entry-v2.spec.js
      - tests/e2e/auth-entry-video-playback.spec.js
      - .github/workflows/auth-entry-media-check.yml

permissions:
  contents: read

jobs:
  verify-vector-opening:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Verify vector-only auth opening contract
        shell: bash
        run: |
          set -euo pipefail

          test ! -e assets/auth-entry-poker-720p.mp4

          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('build-manifest.json', 'utf8'));
          const allAssets = manifest.assets.map(asset => asset.path);
          const authFeature = manifest.features.find(feature => feature.id === 'auth-cloud-save');

          if (!authFeature) throw new Error('auth-cloud-save feature missing');
          if (allAssets.some(path => /\.mp4$/i.test(path))) {
            throw new Error('MP4 remains in the formal deploy asset graph');
          }
          if (authFeature.assets.some(path => /\.mp4$/i.test(path))) {
            throw new Error('MP4 remains in auth-cloud-save feature assets');
          }

          for (const required of [
            'js/auth-entry-v2.js',
            'js/auth-entry-v2.css',
            'js/auth-entry-video-trial.css',
          ]) {
            if (!allAssets.includes(required) || !authFeature.assets.includes(required)) {
              throw new Error(`missing vector auth asset: ${required}`);
            }
          }

          const source = fs.readFileSync('js/auth-entry-v2.js', 'utf8');
          for (const contract of [
            '3.0.0-vector-opening-v2',
            'renderMode: "vector"',
            'videoActive: false',
            'videoState: "disabled"',
            'videoUrl: ""',
          ]) {
            if (!source.includes(contract)) {
              throw new Error(`missing vector runtime contract: ${contract}`);
            }
          }

          if (/auth-entry-poker.*\.mp4/i.test(source)) {
            throw new Error('auth runtime references the retired MP4');
          }
          NODE
