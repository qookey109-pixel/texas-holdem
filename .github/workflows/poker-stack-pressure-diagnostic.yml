name: Poker Stack Pressure Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/poker-stack-pressure-diagnostic.yml"
      - "tests/e2e/poker-stack-pressure-diagnostic-v1.spec.js"
      - "tests/support/poker-stack-pressure-diagnostic-v1.js"
      - "scripts/evaluate-poker-stack-pressure-diagnostic-v1.mjs"
  workflow_dispatch:
    inputs:
      stage:
        description: Diagnostic stage
        required: true
        default: screen
        type: choice
        options:
          - screen
          - deep
          - evidence

permissions:
  contents: read

concurrency:
  group: poker-stack-pressure-diagnostic-${{ github.ref }}-${{ inputs.stage || 'screen' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.plan.outputs.stage }}
      matrix: ${{ steps.plan.outputs.matrix }}
      hands: ${{ steps.plan.outputs.hands }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
    steps:
      - id: plan
        name: Build diagnostic matrix
        shell: bash
        run: |
          stage="${{ inputs.stage || 'screen' }}"
          case "$stage" in
            screen) hands=250; shards=2 ;;
            deep) hands=500; shards=4 ;;
            evidence) hands=1000; shards=10 ;;
            *) echo "Unknown stage: $stage" >&2; exit 1 ;;
          esac
          matrix=$(node -e '
            const shards = Number(process.argv[1]);
            const include = [];
            for (let shard = 0; shard < shards; shard += 1) include.push({ shard });
            process.stdout.write(JSON.stringify({ include }));
          ' "$shards")
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "hands=$hands" >> "$GITHUB_OUTPUT"
          echo "shard_count=$shards" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  evaluate:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install locked test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run stack-pressure diagnostic shard
        env:
          POKER_STACK_PRESSURE_DIAGNOSTIC: "1"
          POKER_STACK_PRESSURE_HANDS: ${{ needs.plan.outputs.hands }}
          POKER_STACK_PRESSURE_SHARD: ${{ matrix.shard }}
          POKER_STACK_PRESSURE_SHARD_COUNT: ${{ needs.plan.outputs.shard_count }}
          POKER_STACK_PRESSURE_SEED_BASE: "26890246"
          POKER_STACK_PRESSURE_OUTPUT_DIR: stack-pressure-results
        run: >-
          npx playwright test
          tests/e2e/poker-stack-pressure-diagnostic-v1.spec.js
          --project=chromium
          --retries=0

      - name: Upload diagnostic telemetry
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: stack-pressure-${{ matrix.shard }}
          path: stack-pressure-results/
          if-no-files-found: error
          retention-days: 14

  summarize:
    needs:
      - plan
      - evaluate
    if: ${{ always() && needs.evaluate.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download diagnostic telemetry
        uses: actions/download-artifact@v8
        with:
          pattern: stack-pressure-*
          path: stack-pressure-results
          merge-multiple: false

      - name: Evaluate stack-pressure diagnostic
        run: node scripts/evaluate-poker-stack-pressure-diagnostic-v1.mjs stack-pressure-results stack-pressure-summary

      - name: Upload diagnostic summary
        uses: actions/upload-artifact@v7
        with:
          name: poker-stack-pressure-${{ needs.plan.outputs.stage }}-summary
          path: stack-pressure-summary/
          if-no-files-found: error
          retention-days: 30
