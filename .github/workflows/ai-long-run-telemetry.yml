name: AI long-run telemetry

on:
  pull_request:
    paths:
      - "app.js"
      - "js/ai-*.js"
      - "js/game-flow.js"
      - "js/showdown-actions.js"
      - "tests/support/ai-long-run-telemetry-v2-9.js"
      - "tests/e2e/ai-long-run-telemetry-v2-9.spec.js"
      - "scripts/aggregate-ai-long-run-telemetry-v2-9.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ai-long-run-telemetry.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: "Telemetry run size"
        required: true
        default: "full"
        type: choice
        options:
          - smoke
          - full
  schedule:
    # GitHub cron uses UTC: Saturday 20:10 = Sunday 04:10 in Taiwan (UTC+8).
    - cron: "10 20 * * 6"

permissions:
  contents: read

concurrency:
  group: ai-long-run-telemetry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare telemetry matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      hands_per_shard: ${{ steps.plan.outputs.hands_per_shard }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
      expected_hands: ${{ steps.plan.outputs.expected_hands }}
      run_profile: ${{ steps.plan.outputs.run_profile }}
    steps:
      - id: plan
        name: Select smoke or full evidence run
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            RUN_PROFILE="smoke"
            SHARD_COUNT=2
            HANDS_PER_SHARD=25
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.profile }}" == "smoke" ]]; then
            RUN_PROFILE="smoke"
            SHARD_COUNT=2
            HANDS_PER_SHARD=50
          else
            RUN_PROFILE="full"
            SHARD_COUNT=50
            HANDS_PER_SHARD=500
          fi
          MATRIX=$(node -e 'const count=Number(process.argv[1]); console.log(JSON.stringify({shard:Array.from({length:count},(_,index)=>index)}));' "$SHARD_COUNT")
          EXPECTED_HANDS=$((SHARD_COUNT * HANDS_PER_SHARD))
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "hands_per_shard=$HANDS_PER_SHARD" >> "$GITHUB_OUTPUT"
          echo "shard_count=$SHARD_COUNT" >> "$GITHUB_OUTPUT"
          echo "expected_hands=$EXPECTED_HANDS" >> "$GITHUB_OUTPUT"
          echo "run_profile=$RUN_PROFILE" >> "$GITHUB_OUTPUT"

  shard:
    name: Telemetry shard ${{ matrix.shard }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      AI_LONG_RUN_TELEMETRY: "1"
      AI_LONG_RUN_HANDS: ${{ needs.prepare.outputs.hands_per_shard }}
      AI_LONG_RUN_SHARD: ${{ matrix.shard }}
      AI_LONG_RUN_SHARD_COUNT: ${{ needs.prepare.outputs.shard_count }}
      AI_LONG_RUN_SEED_BASE: "26890246"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full-hand telemetry shard
        run: >-
          npx playwright test
          tests/e2e/ai-long-run-telemetry-v2-9.spec.js
          --project=chromium --retries=0

      - name: Upload telemetry shard
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ai-long-run-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            test-results/**/ai-long-run-shard-*.json
            test-results/**/ai-long-run-shard-*.md
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: Aggregate telemetry evidence
    needs:
      - prepare
      - shard
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AI_LONG_RUN_EXPECTED_HANDS: ${{ needs.prepare.outputs.expected_hands }}
      AI_LONG_RUN_EXPECTED_SHARDS: ${{ needs.prepare.outputs.shard_count }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Download telemetry shards
        uses: actions/download-artifact@v8
        with:
          pattern: ai-long-run-shard-*-${{ github.run_id }}
          path: telemetry-shards
          merge-multiple: true

      - name: Aggregate role, tier, profile and Boss evidence
        run: node scripts/aggregate-ai-long-run-telemetry-v2-9.mjs telemetry-shards telemetry-summary

      - name: Publish Markdown to workflow summary
        if: ${{ always() }}
        run: cat telemetry-summary/ai-long-run-telemetry-v2-9.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregated telemetry report
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ai-long-run-telemetry-v2-9-${{ needs.prepare.outputs.run_profile }}-${{ github.run_id }}
          path: telemetry-summary/
          if-no-files-found: error
          retention-days: 90
