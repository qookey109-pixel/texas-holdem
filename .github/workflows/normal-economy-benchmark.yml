name: Normal economy 60 vs 65 benchmark

on:
  push:
    branches:
      - normal-economy-benchmark-60-vs-65
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: normal-economy-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: 100 hands each at 60BB and 65BB / seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        seed:
          - 60865001
          - 60865002
          - 60865003
          - 60865004
          - 60865005
          - 60865006
          - 60865007
          - 60865008
          - 60865009
          - 60865010
    env:
      NORMAL_ECONOMY_BENCHMARK: "1"
      NORMAL_ECONOMY_BENCHMARK_HANDS: "100"
      NORMAL_ECONOMY_BENCHMARK_SEED: ${{ matrix.seed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run normal economy benchmark
        run: >-
          npx playwright test
          tests/e2e/normal-economy-benchmark.spec.js
          --project=chromium --retries=0

      - name: Upload benchmark evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: normal-economy-benchmark-${{ matrix.seed }}-${{ github.run_id }}
          path: |
            test-results/**/normal-economy-benchmark-60-vs-65.json
            test-results/**/normal-economy-benchmark-60-vs-65.md
          if-no-files-found: error
          retention-days: 14
