name: AI Replacement Churn Runaway Audit

on:
  pull_request:
    paths:
      - ".github/workflows/ai-replacement-churn-audit.yml"
      - "tests/e2e/ai-replacement-churn-audit-v1.spec.js"
      - "tests/support/ai-replacement-churn-audit-v1.js"
      - "scripts/summarize-ai-replacement-churn-audit-v1.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-replacement-churn-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install locked test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run 250-hand replacement-churn audit shard
        env:
          AI_REPLACEMENT_CHURN_AUDIT: "1"
          AI_REPLACEMENT_CHURN_HANDS: "250"
          AI_REPLACEMENT_CHURN_SHARD: ${{ matrix.shard }}
          AI_REPLACEMENT_CHURN_SHARD_COUNT: "4"
          AI_REPLACEMENT_CHURN_SEED_BASE: "26890246"
          AI_REPLACEMENT_CHURN_OUTPUT_DIR: ai-replacement-churn-results
        run: >-
          npx playwright test
          tests/e2e/ai-replacement-churn-audit-v1.spec.js
          --project=chromium
          --retries=0

      - name: Upload replacement-churn shard
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ai-replacement-churn-audit-${{ matrix.shard }}
          path: ai-replacement-churn-results/
          if-no-files-found: error
          retention-days: 30

  summarize:
    needs: audit
    if: ${{ always() && needs.audit.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download audit shards
        uses: actions/download-artifact@v8
        with:
          pattern: ai-replacement-churn-audit-*
          path: ai-replacement-churn-results
          merge-multiple: false

      - name: Summarize replacement churn trajectories
        run: node scripts/summarize-ai-replacement-churn-audit-v1.mjs ai-replacement-churn-results ai-replacement-churn-summary

      - name: Upload replacement-churn summary
        uses: actions/upload-artifact@v7
        with:
          name: ai-replacement-churn-audit-summary
          path: ai-replacement-churn-summary/
          if-no-files-found: error
          retention-days: 30
