name: Poker Economy Slow Post-L5 Blind Pressure

on:
  pull_request:
    paths:
      - ".github/workflows/poker-economy-post-l5-blind-pressure.yml"
      - "tests/e2e/poker-economy-post-l5-blind-pressure-v1.spec.js"
      - "tests/support/poker-economy-post-l5-blind-pressure-v1.js"
      - "scripts/evaluate-poker-economy-post-l5-blind-pressure-v1.mjs"
      - "tests/support/ai-long-run-telemetry-v2-9.part-*"
      - "tests/support/ai-long-run-telemetry-integrity-v2-9-4.js"

permissions:
  contents: read

concurrency:
  group: poker-economy-post-l5-blind-pressure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        policy: ["frozen-l5", "slow-post-l5"]
        profile: ["tight", "balanced", "calling"]
        pair: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install locked test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run 250-hand paired post-L5 blind-pressure benchmark
        env:
          POKER_ECONOMY_POST_L5_BLIND_PRESSURE: "1"
          POKER_ECONOMY_POST_L5_BLIND_PRESSURE_POLICY: ${{ matrix.policy }}
          POKER_ECONOMY_POST_L5_BLIND_PRESSURE_PROFILE: ${{ matrix.profile }}
          POKER_ECONOMY_POST_L5_BLIND_PRESSURE_PAIR: ${{ matrix.pair }}
          POKER_ECONOMY_POST_L5_BLIND_PRESSURE_HANDS: "250"
          POKER_ECONOMY_POST_L5_BLIND_PRESSURE_SEED_BASE: "26893246"
          POKER_ECONOMY_POST_L5_BLIND_PRESSURE_OUTPUT_DIR: poker-economy-post-l5-blind-pressure-results
        run: npx playwright test tests/e2e/poker-economy-post-l5-blind-pressure-v1.spec.js --project=chromium --retries=0
      - if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: poker-economy-post-l5-${{ matrix.policy }}-${{ matrix.profile }}-pair-${{ matrix.pair }}
          path: poker-economy-post-l5-blind-pressure-results/
          if-no-files-found: error
          retention-days: 14

  summarize:
    needs: [evaluate]
    if: ${{ always() && needs.evaluate.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: poker-economy-post-l5-*
          path: poker-economy-post-l5-blind-pressure-results
          merge-multiple: false
      - name: Summarize paired post-L5 blind evidence
        run: node scripts/evaluate-poker-economy-post-l5-blind-pressure-v1.mjs poker-economy-post-l5-blind-pressure-results poker-economy-post-l5-blind-pressure-summary
      - name: Require valid schedule application
        run: >-
          node -e '
          const fs = require("fs");
          const p = "poker-economy-post-l5-blind-pressure-summary/poker-economy-post-l5-blind-pressure-v1.json";
          const s = JSON.parse(fs.readFileSync(p, "utf8"));
          if (!s.scheduleApplied) throw new Error("INERT_SCHEDULE_CANDIDATE");
          if (!s.replacementDepthPreserved) throw new Error("REPLACEMENT_DEPTH_DRIFT");
          console.log(`scheduleApplied=${s.scheduleApplied} replacementDepthPreserved=${s.replacementDepthPreserved}`);
          '
      - uses: actions/upload-artifact@v7
        with:
          name: poker-economy-post-l5-blind-pressure-summary
          path: poker-economy-post-l5-blind-pressure-summary/
          if-no-files-found: error
          retention-days: 30
