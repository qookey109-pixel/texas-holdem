name: Rebuild auth entry video trial

on:
  push:
    branches:
      - ui/auth-entry-video-trial
    paths:
      - '.github/workflows/rebuild-auth-entry-video-trial.yml'

permissions:
  contents: write

jobs:
  rebuild-video:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ui/auth-entry-video-trial
          fetch-depth: 0

      - name: Rebuild MP4 and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          cat \
            assets/auth-entry-video/trial-01.b64 \
            assets/auth-entry-video/trial-02.b64 \
            assets/auth-entry-video/trial-03.b64 \
            assets/auth-entry-video/trial-04.b64 \
            assets/auth-entry-video/trial-05.b64 \
            assets/auth-entry-video/trial-06.b64 \
            | tr -d '\r\n' \
            | base64 --decode > assets/auth-entry-poker-trial.mp4
          echo 'cf850583bc8b248a20227d038a52920e8b9ff6e73c8c6bb5d1524eb606b59a36  assets/auth-entry-poker-trial.mp4' | sha256sum --check --strict
          test "$(stat -c%s assets/auth-entry-poker-trial.mp4)" -eq 64071

      - name: Remove temporary transport files
        shell: bash
        run: |
          rm -f assets/auth-entry-video/trial-*.b64
          rm -f assets/auth-entry-video/part-01.txt
          rmdir assets/auth-entry-video 2>/dev/null || true
          rm -f .github/workflows/rebuild-auth-entry-video-trial.yml

      - name: Commit reconstructed video
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Add reconstructed auth entry trial video'
          git push origin HEAD:ui/auth-entry-video-trial
