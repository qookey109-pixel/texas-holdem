name: AI Balanced Large Pot Response Audit

on:
  pull_request:
    paths:
      - ".github/workflows/ai-balanced-large-pot-response-audit.yml"
      - "scripts/summarize-ai-balanced-large-pot-response-audit-v1.mjs"
      - "tests/e2e/ai-balanced-large-pot-response-audit-v1.spec.js"
      - "tests/support/ai-balanced-large-pot-response-audit-v1.js"
  workflow_dispatch:

concurrency:
  group: ai-balanced-large-pot-response-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: tight
            pair: 0
          - profile: balanced
            pair: 0
          - profile: calling
            pair: 0
          - profile: tight
            pair: 1
          - profile: balanced
            pair: 1
          - profile: calling
            pair: 1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run 250-hand paired response audit
        env:
          AI_BALANCED_LARGE_POT_RESPONSE_AUDIT: "1"
          AI_BALANCED_LARGE_POT_RESPONSE_HANDS: "250"
          AI_BALANCED_LARGE_POT_RESPONSE_PROFILE: ${{ matrix.profile }}
          AI_BALANCED_LARGE_POT_RESPONSE_PAIR: ${{ matrix.pair }}
          AI_BALANCED_LARGE_POT_RESPONSE_OUTPUT_DIR: ai-balanced-large-pot-response-results
        run: npx playwright test tests/e2e/ai-balanced-large-pot-response-audit-v1.spec.js --project=chromium --workers=1
      - name: Upload paired response shard
        uses: actions/upload-artifact@v7
        with:
          name: ai-balanced-large-pot-response-${{ matrix.profile }}-pair-${{ matrix.pair }}
          path: ai-balanced-large-pot-response-results/
          if-no-files-found: error
          retention-days: 30

  summarize:
    needs: audit
    if: ${{ always() && needs.audit.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download paired response shards
        uses: actions/download-artifact@v8
        with:
          pattern: ai-balanced-large-pot-response-*
          path: ai-balanced-large-pot-response-results
          merge-multiple: false
      - name: Summarize paired response audit
        run: node scripts/summarize-ai-balanced-large-pot-response-audit-v1.mjs ai-balanced-large-pot-response-results ai-balanced-large-pot-response-summary
      - name: Upload response summary
        uses: actions/upload-artifact@v7
        with:
          name: ai-balanced-large-pot-response-audit-summary
          path: ai-balanced-large-pot-response-summary/
          if-no-files-found: error
          retention-days: 30
