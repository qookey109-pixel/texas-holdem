name: Long Session pacing telemetry

on:
  pull_request:
    paths:
      - "tests/e2e/long-session-full-hand-pacing-telemetry-v1.spec.js"
      - "tests/support/long-session-pacing-metrics-v1.js"
      - "js/long-session-mode-v1.js"
      - ".github/workflows/long-session-pacing-telemetry.yml"
  workflow_dispatch:
    inputs:
      hands:
        description: "Completed-hand opportunities"
        required: false
        default: "12"
      seed:
        description: "Deterministic seed"
        required: false
        default: "1279545165"

permissions:
  contents: read

concurrency:
  group: long-session-pacing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LONG_SESSION_PACING_HANDS: ${{ inputs.hands || '12' }}
      LONG_SESSION_PACING_SEED: ${{ inputs.seed || '1279545165' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install locked test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run fixed-seed full-hand telemetry
        run: >-
          npx playwright test
          tests/e2e/long-session-full-hand-pacing-telemetry-v1.spec.js
          --project=chromium
          --retries=0

      - name: Print pacing evidence summary
        if: ${{ success() }}
        shell: bash
        run: |
          REPORT="$(find test-results -name 'long-session-full-hand-pacing-telemetry-v1.json' -print -quit)"
          test -n "$REPORT"
          node - "$REPORT" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const summary = {
            schemaVersion: report.schemaVersion,
            evidenceKind: report.evidenceKind,
            interpretation: report.interpretation,
            notNormalBugEvidence: report.notNormalBugEvidence,
            seed: report.seed,
            fingerprint: report.deterministicFingerprint,
            configuredHands: report.configuredHands,
            handsCompleted: report.handsCompleted,
            sessionEnded: report.sessionEnded,
            heroBb100: report.pacing?.heroBb100,
            bustFrequency: report.pacing?.bustFrequency,
            reentryFrequency: report.pacing?.reentryFrequency,
            activeStackRisk: report.pacing?.activeStackRisk,
            progression: report.pacing?.progression,
            actionCounts: report.actionCounts,
            fairness: report.fairness,
            failures: report.failures,
            schedulerErrors: report.schedulerErrors,
          };
          console.log(`LONG_SESSION_PACING_REPORT ${JSON.stringify(summary)}`);
          NODE

      - name: Upload pacing evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: long-session-pacing-${{ github.run_id }}
          path: test-results/**/long-session-full-hand-pacing-telemetry-v1.json
          if-no-files-found: error
          retention-days: 14
