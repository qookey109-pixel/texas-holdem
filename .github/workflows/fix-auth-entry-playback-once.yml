name: Fix auth entry playback once

on:
  push:
    branches:
      - fix/auth-entry-video-playback
    paths:
      - .tmp/fix-auth-playback/READY

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/auth-entry-video-playback
          fetch-depth: 0

      - name: Inspect and re-encode web-safe 720p video
        shell: bash
        run: |
          set -euo pipefail
          src="assets/auth-entry-poker-720p.mp4"
          tmp="assets/auth-entry-poker-720p.web.mp4"

          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

          echo "SOURCE INFO"
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,profile,width,height,pix_fmt,r_frame_rate,avg_frame_rate \
            -show_entries format=duration,size \
            -of json "$src"

          source_unique_frames="$(ffmpeg -v error -i "$src" -vf fps=1 -t 6 -f framemd5 - | awk -F, '!/^#/ {gsub(/ /,"",$NF); print $NF}' | sort -u | wc -l | tr -d ' ')"
          echo "source unique sampled frames: ${source_unique_frames}"
          test "$source_unique_frames" -ge 3

          ffmpeg -y -v error -i "$src" \
            -map 0:v:0 \
            -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2:black,format=yuv420p" \
            -c:v libx264 -preset medium -crf 18 \
            -profile:v main -level:v 3.1 \
            -r 30 -g 60 -keyint_min 30 -sc_threshold 0 \
            -movflags +faststart -an "$tmp"

          echo "OUTPUT INFO"
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,profile,width,height,pix_fmt,r_frame_rate,avg_frame_rate \
            -show_entries format=duration,size \
            -of json "$tmp"

          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$tmp")" = "h264"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$tmp")" = "1280"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$tmp")" = "720"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$tmp")" = "yuv420p"

          output_unique_frames="$(ffmpeg -v error -i "$tmp" -vf fps=1 -t 6 -f framemd5 - | awk -F, '!/^#/ {gsub(/ /,"",$NF); print $NF}' | sort -u | wc -l | tr -d ' ')"
          echo "output unique sampled frames: ${output_unique_frames}"
          test "$output_unique_frames" -ge 3

          python - <<'PY'
          from pathlib import Path
          p = Path('assets/auth-entry-poker-720p.web.mp4')
          data = p.read_bytes()
          moov = data.find(b'moov')
          mdat = data.find(b'mdat')
          print({'size': len(data), 'moov': moov, 'mdat': mdat})
          assert 0 <= moov < mdat, 'MP4 is not fast-start optimized (moov must precede mdat)'
          assert len(data) < 8_000_000, 'web video unexpectedly large'
          PY

          mv "$tmp" "$src"

      - name: Update auth cache keys and tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              assert count == expected, f'{path}: expected {expected}, found {count}: {old!r}'
              p.write_text(text.replace(old, new))

          replace_exact(
              'js/auth-entry-v2.js',
              'videoUrl: "assets/auth-entry-poker-720p.mp4?v=auth-entry-video-720p-v1",',
              'videoUrl: "assets/auth-entry-poker-720p.mp4?v=auth-entry-video-playback-v2",',
          )
          replace_exact(
              'js/auth-entry-v2.js',
              'version: "2.1.1-hd",',
              'version: "2.1.2-playback-fix",',
          )
          replace_exact(
              'js/config.js',
              'authScript.src = "js/auth-entry-v2.js?v=auth-entry-video-720p-v1";',
              'authScript.src = "js/auth-entry-v2.js?v=auth-entry-video-playback-v2";',
          )

          test_path = Path('tests/e2e/auth-entry-v2.spec.js')
          text = test_path.read_text()
          assert text.count('.toBe("2.1.1-hd");') == 3
          assert text.count('auth-entry-video-720p-v1') == 1
          text = text.replace('.toBe("2.1.1-hd");', '.toBe("2.1.2-playback-fix");')
          text = text.replace('auth-entry-video-720p-v1', 'auth-entry-video-playback-v2')
          test_path.write_text(text)
          PY

      - name: Add permanent moving-video integrity check and clean failed PR artifacts
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/auth-entry-media-check.yml <<'YAML'
          name: Auth entry media check

          on:
            pull_request:
              paths:
                - assets/auth-entry-poker-720p.mp4
                - js/auth-entry-v2.js
                - js/config.js
                - tests/e2e/auth-entry-v2.spec.js
                - .github/workflows/auth-entry-media-check.yml
            push:
              branches:
                - main
              paths:
                - assets/auth-entry-poker-720p.mp4
                - js/auth-entry-v2.js
                - js/config.js
                - tests/e2e/auth-entry-v2.spec.js
                - .github/workflows/auth-entry-media-check.yml

          jobs:
            verify-media:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Install ffmpeg
                  run: |
                    if ! command -v ffprobe >/dev/null 2>&1; then
                      sudo apt-get update
                      sudo apt-get install -y ffmpeg
                    fi
                - name: Verify web-safe moving 720p video
                  shell: bash
                  run: |
                    set -euo pipefail
                    file="assets/auth-entry-poker-720p.mp4"
                    test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$file")" = "h264"
                    test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$file")" = "1280"
                    test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$file")" = "720"
                    test "$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$file")" = "yuv420p"
                    unique_frames="$(ffmpeg -v error -i "$file" -vf fps=1 -t 6 -f framemd5 - | awk -F, '!/^#/ {gsub(/ /,"",$NF); print $NF}' | sort -u | wc -l | tr -d ' ')"
                    echo "unique sampled frames: ${unique_frames}"
                    test "$unique_frames" -ge 3
                    python - <<'PY'
                    from pathlib import Path
                    data = Path('assets/auth-entry-poker-720p.mp4').read_bytes()
                    moov = data.find(b'moov')
                    mdat = data.find(b'mdat')
                    print({'size': len(data), 'moov': moov, 'mdat': mdat})
                    assert 0 <= moov < mdat
                    assert len(data) < 8_000_000
                    PY
          YAML

          rm -rf .tmp/auth-native-720p .tmp/auth-native-blob .tmp/fix-auth-playback
          rm -f .github/workflows/auth-entry-native-720p-once.yml
          rm -f .github/workflows/auth-entry-native-blob-once.yml
          rm -f .github/workflows/fix-auth-entry-playback-once.yml

      - name: Commit playback fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Fix auth entry video playback and media validation"
          git push origin HEAD:fix/auth-entry-video-playback
