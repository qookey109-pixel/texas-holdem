name: AI V2.9 long-run recovery

on:
  push:
    branches:
      - main
    paths:
      - ".github/ai-long-run-recovery-triggers/**"
  pull_request:
    paths:
      - "js/ai-opening-balance-v2-9-5.js"
      - "js/ai-wtsd-discipline-v2-9-5-r1.js"
      - "tests/e2e/ai-wtsd-discipline-v2-9-5-r1.spec.js"
      - "tests/e2e/ai-long-run-telemetry-v2-9.spec.js"
      - "scripts/aggregate-ai-long-run-telemetry-v2-9.mjs"
      - ".github/workflows/ai-long-run-recovery-v2-9.yml"
      - ".github/workflows/ai-long-run-telemetry.yml"
      - ".github/ai-long-run-recovery-triggers/**"
      - ".github/ai-long-run-triggers/**"
      - ".github/ai-long-run-stability-triggers/**"

permissions:
  actions: read
  contents: read

concurrency:
  group: ai-v2-9-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare recovery matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      hands_per_shard: ${{ steps.plan.outputs.hands_per_shard }}
      expected_hands: ${{ steps.plan.outputs.expected_hands }}
      expected_shards: ${{ steps.plan.outputs.expected_shards }}
      source_run_id: ${{ steps.plan.outputs.source_run_id }}
      run_profile: ${{ steps.plan.outputs.run_profile }}
    steps:
      - id: plan
        name: Select smoke or missing full shards
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            RUN_PROFILE="recovery-smoke"
            SHARDS='[10,15]'
            HANDS_PER_SHARD=25
            EXPECTED_HANDS=50
            EXPECTED_SHARDS=2
            SOURCE_RUN_ID=0
          else
            RUN_PROFILE="recovery-full"
            SHARDS='[10,15,20,28,33,38,43,46,48]'
            HANDS_PER_SHARD=500
            EXPECTED_HANDS=25000
            EXPECTED_SHARDS=50
            SOURCE_RUN_ID=31070115815
          fi
          echo "matrix={\"shard\":$SHARDS}" >> "$GITHUB_OUTPUT"
          echo "hands_per_shard=$HANDS_PER_SHARD" >> "$GITHUB_OUTPUT"
          echo "expected_hands=$EXPECTED_HANDS" >> "$GITHUB_OUTPUT"
          echo "expected_shards=$EXPECTED_SHARDS" >> "$GITHUB_OUTPUT"
          echo "source_run_id=$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run_profile=$RUN_PROFILE" >> "$GITHUB_OUTPUT"

  shard:
    name: Recovery shard ${{ matrix.shard }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      AI_LONG_RUN_TELEMETRY: "1"
      AI_LONG_RUN_HANDS: ${{ needs.prepare.outputs.hands_per_shard }}
      AI_LONG_RUN_SHARD: ${{ matrix.shard }}
      AI_LONG_RUN_SHARD_COUNT: "50"
      AI_LONG_RUN_SEED_BASE: "26890246"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run missing telemetry shard
        run: >-
          npx playwright test
          tests/e2e/ai-long-run-telemetry-v2-9.spec.js
          --project=chromium --retries=0

      - name: Upload recovered telemetry shard
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ai-v2-9-recovery-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            test-results/**/ai-long-run-shard-*.json
            test-results/**/ai-long-run-shard-*.md
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: Merge original and recovered evidence
    needs:
      - prepare
      - shard
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AI_LONG_RUN_EXPECTED_HANDS: ${{ needs.prepare.outputs.expected_hands }}
      AI_LONG_RUN_EXPECTED_SHARDS: ${{ needs.prepare.outputs.expected_shards }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Download original 20,500-hand evidence
        if: ${{ needs.prepare.outputs.source_run_id != '0' }}
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.prepare.outputs.source_run_id }}
          pattern: ai-long-run-shard-*-${{ needs.prepare.outputs.source_run_id }}
          path: telemetry-shards
          merge-multiple: true

      - name: Download recovered shards
        uses: actions/download-artifact@v8
        with:
          pattern: ai-v2-9-recovery-shard-*-${{ github.run_id }}
          path: telemetry-shards
          merge-multiple: true

      - name: Aggregate complete V2.9 evidence
        run: node scripts/aggregate-ai-long-run-telemetry-v2-9.mjs telemetry-shards telemetry-summary

      - name: Publish Markdown to workflow summary
        if: ${{ always() }}
        run: cat telemetry-summary/ai-long-run-telemetry-v2-9.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload recovered aggregate report
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ai-long-run-telemetry-v2-9-${{ needs.prepare.outputs.run_profile }}-${{ github.run_id }}
          path: telemetry-summary/
          if-no-files-found: error
          retention-days: 90
