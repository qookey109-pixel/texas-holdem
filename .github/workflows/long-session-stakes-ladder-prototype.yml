name: Long Session Stakes Ladder Prototype

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/long-session-stakes-ladder-prototype.yml"
      - "tests/e2e/long-session-stakes-ladder-v1.spec.js"
      - "tests/support/long-session-stakes-ladder-v1.js"

permissions:
  contents: read

jobs:
  prototype:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked test dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Long Session prototype invariants
        run: npx playwright test tests/e2e/long-session-stakes-ladder-v1.spec.js --project=${{ matrix.browser }} --retries=0
