name: Long Session promotion threshold sweep

on:
  pull_request:
    paths:
      - "tests/e2e/long-session-balanced-pacing-evidence-v1.spec.js"
      - "tests/support/long-session-pacing-metrics-v1.js"
      - "js/long-session-mode-v1.js"
      - ".github/workflows/long-session-promotion-threshold-sweep.yml"
  workflow_dispatch:
    inputs:
      hands:
        description: "Completed-hand opportunities per seed/variant"
        required: false
        default: "60"

permissions:
  contents: read

concurrency:
  group: long-session-promotion-threshold-sweep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    name: evidence (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x1_00
            multiplier: "1.00"
          - label: x1_25
            multiplier: "1.25"
          - label: x1_50
            multiplier: "1.50"
          - label: x1_75
            multiplier: "1.75"
    env:
      LONG_SESSION_BALANCED_HANDS: ${{ inputs.hands || '60' }}
      PROMOTION_MULTIPLIER: ${{ matrix.multiplier }}
      VARIANT_LABEL: ${{ matrix.label }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install locked test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Apply ephemeral reserve and promotion threshold
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'js/long-session-mode-v1.js';
          const multiplier = Number(process.env.PROMOTION_MULTIPLIER);
          if (!Number.isFinite(multiplier) || multiplier < 1 || multiplier >= 2) {
            throw new Error(`invalid promotion multiplier ${process.env.PROMOTION_MULTIPLIER}`);
          }

          let source = fs.readFileSync(file, 'utf8');

          const reserveNeedle = 'session = createSession({ tableIndex: 0, bankroll: 0, tableStack: TABLES[0].entry });';
          const reserveReplacement = 'session = createSession({ tableIndex: 0, bankroll: 2000, tableStack: TABLES[0].entry });';
          const reserveMatches = source.split(reserveNeedle).length - 1;
          if (reserveMatches !== 1) {
            throw new Error(`expected exactly one Long Session bankroll baseline, found ${reserveMatches}`);
          }
          source = source.replace(reserveNeedle, reserveReplacement);

          const thresholdNeedle = 'if (observedTotalWealth >= candidate.entry) {';
          const thresholdMatches = source.split(thresholdNeedle).length - 1;
          if (thresholdMatches !== 1) {
            throw new Error(`expected exactly one Long Session promotion threshold, found ${thresholdMatches}`);
          }
          if (multiplier !== 1) {
            source = source.replace(
              thresholdNeedle,
              `if (observedTotalWealth >= candidate.entry * ${multiplier}) {`,
            );
          }

          fs.writeFileSync(file, source);
          console.log(`LONG_SESSION_THRESHOLD_SWEEP_EPHEMERAL variant=${process.env.VARIANT_LABEL} bankroll=2000 multiplier=${multiplier}`);
          NODE
          git diff --check
          git diff -- js/long-session-mode-v1.js

      - name: Prove same-seed reproducibility
        shell: bash
        run: |
          for LABEL in a b; do
            echo "=== ${VARIANT_LABEL} repro / ${LABEL} ==="
            LONG_SESSION_BALANCED_SEED="1279545165" \
              npx playwright test \
              tests/e2e/long-session-balanced-pacing-evidence-v1.spec.js \
              --project=chromium \
              --retries=0 \
              --output="repro-results/${VARIANT_LABEL}-${LABEL}"
          done

          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const walk = dir => fs.readdirSync(dir, { withFileTypes: true })
            .flatMap(entry => entry.isDirectory()
              ? walk(path.join(dir, entry.name))
              : [path.join(dir, entry.name)]);

          const read = label => {
            const root = `repro-results/${process.env.VARIANT_LABEL}-${label}`;
            const file = walk(root).find(file => file.endsWith('long-session-balanced-pacing-evidence-v1.json'));
            if (!file) throw new Error(`missing repro report ${label}`);
            return JSON.parse(fs.readFileSync(file, 'utf8'));
          };

          const left = read('a');
          const right = read('b');
          const result = {
            variant: process.env.VARIANT_LABEL,
            multiplier: Number(process.env.PROMOTION_MULTIPLIER),
            sameFingerprint: left.deterministicFingerprint === right.deterministicFingerprint,
            samePacing: JSON.stringify(left.pacingHands) === JSON.stringify(right.pacingHands),
            sameActions: JSON.stringify(left.actionCounts) === JSON.stringify(right.actionCounts),
            leftFingerprint: left.deterministicFingerprint,
            rightFingerprint: right.deterministicFingerprint,
            initialBankroll: left.pacingHands?.[0]?.bankrollBefore,
          };
          console.log(`LONG_SESSION_THRESHOLD_SWEEP_REPRO ${JSON.stringify(result)}`);

          if (!result.sameFingerprint || !result.samePacing || !result.sameActions || result.initialBankroll !== 2000) {
            process.exit(1);
          }
          NODE

      - name: Run 8-seed live-runtime matrix
        shell: bash
        run: |
          for SEED in 1279545165 1279545166 1279545167 1279545168 1279545169 1279545170 1279545171 1279545172; do
            echo "=== ${VARIANT_LABEL} seed=${SEED} multiplier=${PROMOTION_MULTIPLIER} ==="
            LONG_SESSION_BALANCED_SEED="$SEED" \
              npx playwright test \
              tests/e2e/long-session-balanced-pacing-evidence-v1.spec.js \
              --project=chromium \
              --retries=0 \
              --output="sweep-results/${VARIANT_LABEL}/seed-${SEED}"
          done

      - name: Summarize variant and verify promotion invariant
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const multiplier = Number(process.env.PROMOTION_MULTIPLIER);
          const label = process.env.VARIANT_LABEL;

          const walk = dir => fs.readdirSync(dir, { withFileTypes: true })
            .flatMap(entry => entry.isDirectory()
              ? walk(path.join(dir, entry.name))
              : [path.join(dir, entry.name)]);

          const reports = walk(`sweep-results/${label}`)
            .filter(file => file.endsWith('long-session-balanced-pacing-evidence-v1.json'))
            .map(file => JSON.parse(fs.readFileSync(file, 'utf8')))
            .sort((a, b) => a.seed - b.seed);

          if (reports.length !== 8) {
            throw new Error(`expected 8 reports for ${label}, got ${reports.length}`);
          }

          const promotionViolations = [];
          for (const report of reports) {
            for (const hand of report.handReports || []) {
              if (hand.transition !== 'move-up') continue;
              const target = report.tables?.[hand.targetTableIndex];
              const threshold = (target?.entry || 0) * multiplier;
              if (!target || hand.expectedObservedWealth < threshold) {
                promotionViolations.push({
                  seed: report.seed,
                  handNumber: hand.handNumber,
                  targetTableIndex: hand.targetTableIndex,
                  expectedObservedWealth: hand.expectedObservedWealth,
                  threshold,
                });
              }
            }
          }

          const aggregate = {
            label,
            multiplier,
            seeds: reports.length,
            totalHandsCompleted: reports.reduce((sum, report) => sum + report.handsCompleted, 0),
            meanHandsCompleted: Number((reports.reduce((sum, report) => sum + report.handsCompleted, 0) / reports.length).toFixed(3)),
            sessionEndedSeeds: reports.filter(report => report.sessionEnded).length,
            movedUpSeeds: reports.filter(report => (report.pacing?.progression?.moveUps || 0) > 0).length,
            reachedT3Seeds: reports.filter(report => (report.pacing?.progression?.highestTableIndex || 0) >= 2).length,
            reachedFinalTableSeeds: reports.filter(report => report.pacing?.progression?.reachedFinalTable).length,
            reentrySeeds: reports.filter(report => (report.pacing?.reentryFrequency || 0) > 0).length,
            meanExposure: Number((reports.reduce((sum, report) => sum + (report.pacing?.activeStackRisk?.meanExposedWealthRatio || 0), 0) / reports.length).toFixed(6)),
            failures: reports.reduce((sum, report) => sum + report.failures.length, 0),
            schedulerErrors: reports.reduce((sum, report) => sum + report.schedulerErrors.length, 0),
            allInitialBankroll2000: reports.every(report => report.pacingHands?.[0]?.bankrollBefore === 2000),
            promotionViolations: promotionViolations.length,
          };

          for (const report of reports) {
            console.log(`LONG_SESSION_THRESHOLD_SWEEP_REPORT ${JSON.stringify({
              label,
              multiplier,
              seed: report.seed,
              fingerprint: report.deterministicFingerprint,
              handsCompleted: report.handsCompleted,
              sessionEnded: report.sessionEnded,
              heroBb100: report.pacing?.heroBb100,
              bustFrequency: report.pacing?.bustFrequency,
              reentryFrequency: report.pacing?.reentryFrequency,
              activeStackRisk: report.pacing?.activeStackRisk,
              progression: report.pacing?.progression,
              failures: report.failures,
              schedulerErrors: report.schedulerErrors,
            })}`);
          }

          console.log(`LONG_SESSION_THRESHOLD_SWEEP_VARIANT ${JSON.stringify(aggregate)}`);

          if (aggregate.failures || aggregate.schedulerErrors || !aggregate.allInitialBankroll2000 || aggregate.promotionViolations) {
            throw new Error(`variant integrity failed: ${JSON.stringify(aggregate)}`);
          }

          if (multiplier === 1) {
            const accepted = {
              label: 'x1_00',
              multiplier: 1,
              seeds: 8,
              totalHandsCompleted: 62,
              meanHandsCompleted: 7.75,
              sessionEndedSeeds: 8,
              movedUpSeeds: 6,
              reachedT3Seeds: 0,
              reachedFinalTableSeeds: 0,
              reentrySeeds: 3,
              meanExposure: 0.687782,
              failures: 0,
              schedulerErrors: 0,
              allInitialBankroll2000: true,
              promotionViolations: 0,
            };
            if (JSON.stringify(aggregate) !== JSON.stringify(accepted)) {
              throw new Error(`PR #203 reserve-only parity failed: ${JSON.stringify({ accepted, actual: aggregate })}`);
            }
            console.log(`LONG_SESSION_THRESHOLD_SWEEP_CONTROL_PARITY ${JSON.stringify({ accepted, actual: aggregate })}`);
          }

          fs.writeFileSync(`sweep-summary-${label}.json`, JSON.stringify(aggregate, null, 2));
          NODE

      - name: Upload variant evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: long-session-promotion-threshold-${{ matrix.label }}-${{ github.run_id }}
          path: |
            repro-results/**/long-session-balanced-pacing-evidence-v1.json
            sweep-results/${{ matrix.label }}/**/long-session-balanced-pacing-evidence-v1.json
            sweep-summary-${{ matrix.label }}.json
          if-no-files-found: error
          retention-days: 14

  aggregate:
    name: aggregate threshold sweep
    needs: evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download variant evidence
        uses: actions/download-artifact@v7
        with:
          pattern: long-session-promotion-threshold-*
          path: sweep-artifacts
          merge-multiple: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Compare sweep Pareto tradeoffs
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const walk = dir => fs.readdirSync(dir, { withFileTypes: true })
            .flatMap(entry => entry.isDirectory()
              ? walk(path.join(dir, entry.name))
              : [path.join(dir, entry.name)]);

          const summaries = walk('sweep-artifacts')
            .filter(file => /sweep-summary-x1_(00|25|50|75)\.json$/.test(file))
            .map(file => JSON.parse(fs.readFileSync(file, 'utf8')))
            .sort((a, b) => a.multiplier - b.multiplier);

          if (summaries.length !== 4) {
            throw new Error(`expected four threshold summaries, got ${summaries.length}`);
          }

          const acceptedX2 = {
            label: 'x2_00_reference',
            multiplier: 2,
            seeds: 8,
            totalHandsCompleted: 144,
            meanHandsCompleted: 18,
            sessionEndedSeeds: 8,
            movedUpSeeds: 4,
            reachedT3Seeds: 0,
            reachedFinalTableSeeds: 0,
            reentrySeeds: 8,
            meanExposure: 0.586264,
            failures: 0,
            schedulerErrors: 0,
            allInitialBankroll2000: true,
            promotionViolations: 0,
            source: 'accepted-pr-204-reference',
          };

          const rows = [...summaries, acceptedX2];

          const valid = row =>
            row.failures === 0 &&
            row.schedulerErrors === 0 &&
            row.promotionViolations === 0 &&
            row.allInitialBankroll2000 === true;

          const dominates = (a, b) => {
            const noWorse =
              a.meanHandsCompleted >= b.meanHandsCompleted &&
              a.movedUpSeeds >= b.movedUpSeeds &&
              a.reachedT3Seeds >= b.reachedT3Seeds &&
              a.meanExposure <= b.meanExposure;
            const strictlyBetter =
              a.meanHandsCompleted > b.meanHandsCompleted ||
              a.movedUpSeeds > b.movedUpSeeds ||
              a.reachedT3Seeds > b.reachedT3Seeds ||
              a.meanExposure < b.meanExposure;
            return noWorse && strictlyBetter;
          };

          const eligible = rows.filter(valid);
          const pareto = eligible.filter(candidate =>
            !eligible.some(other => other !== candidate && dominates(other, candidate)))
            .map(row => row.multiplier);

          const result = {
            evidenceKind: 'fixed-seed-live-runtime-threshold-sweep',
            reserve: 2000,
            seeds: '1279545165-1279545172',
            objectives: {
              maximize: ['meanHandsCompleted', 'movedUpSeeds', 'reachedT3Seeds'],
              minimize: ['meanExposure'],
              diagnostics: ['reentrySeeds', 'sessionEndedSeeds'],
            },
            rows,
            paretoMultipliers: pareto,
            productionDecisionAuthorized: false,
            manualPlayFeelStillRequired: true,
            notNormalBugEvidence: true,
          };

          console.log(`LONG_SESSION_THRESHOLD_SWEEP_AGGREGATE ${JSON.stringify(result)}`);
          fs.writeFileSync('long-session-promotion-threshold-sweep-summary.json', JSON.stringify(result, null, 2));
          NODE

      - name: Upload aggregate threshold sweep
        uses: actions/upload-artifact@v7
        with:
          name: long-session-promotion-threshold-sweep-${{ github.run_id }}
          path: long-session-promotion-threshold-sweep-summary.json
          if-no-files-found: error
          retention-days: 14
