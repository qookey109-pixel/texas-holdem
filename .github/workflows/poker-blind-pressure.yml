name: Poker Blind Pressure Benchmark

on:
  pull_request:
    paths:
      - ".github/workflows/poker-blind-pressure.yml"
      - "tests/e2e/poker-blind-pressure-v1.spec.js"
      - "tests/support/poker-blind-pressure-v1.js"
      - "scripts/evaluate-poker-blind-pressure-v1.mjs"
      - "scripts/check-poker-blind-pressure-repro-v1.mjs"
  workflow_dispatch:
    inputs:
      stage:
        description: Benchmark stage
        required: true
        default: screen
        type: choice
        options: [screen, deep, evidence]

permissions:
  contents: read

concurrency:
  group: poker-blind-pressure-${{ github.ref }}-${{ inputs.stage || 'screen' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.plan.outputs.stage }}
      matrix: ${{ steps.plan.outputs.matrix }}
      hands: ${{ steps.plan.outputs.hands }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
    steps:
      - id: plan
        name: Build gentle bounded blind pressure candidate matrix
        shell: bash
        run: |
          stage="${{ inputs.stage || 'screen' }}"
          case "$stage" in
            screen) hands=250; shards=4 ;;
            deep) hands=500; shards=6 ;;
            evidence) hands=1000; shards=10 ;;
            *) echo "Unknown stage: $stage" >&2; exit 1 ;;
          esac
          matrix=$(node -e '
            const policies = ["baseline", "gentle50", "gentle100"];
            const shards = Number(process.argv[1]);
            const include = [];
            for (const policy of policies) for (let shard = 0; shard < shards; shard += 1) include.push({ policy, shard });
            process.stdout.write(JSON.stringify({ include }));
          ' "$shards")
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "hands=$hands" >> "$GITHUB_OUTPUT"
          echo "shard_count=$shards" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      POKER_BLIND_PRESSURE: "1"
      POKER_BLIND_PRESSURE_POLICY: "gentle100"
      POKER_BLIND_PRESSURE_HANDS: "150"
      POKER_BLIND_PRESSURE_SHARD: "0"
      POKER_BLIND_PRESSURE_SHARD_COUNT: "1"
      POKER_BLIND_PRESSURE_SEED_BASE: "26890246"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Replay A
        env:
          POKER_BLIND_PRESSURE_OUTPUT_DIR: blind-pressure-repro/run-a
        run: npx playwright test tests/e2e/poker-blind-pressure-v1.spec.js --project=chromium --retries=0
      - name: Replay B
        env:
          POKER_BLIND_PRESSURE_OUTPUT_DIR: blind-pressure-repro/run-b
        run: npx playwright test tests/e2e/poker-blind-pressure-v1.spec.js --project=chromium --retries=0
      - name: Compare deterministic evidence
        run: >-
          node scripts/check-poker-blind-pressure-repro-v1.mjs
          blind-pressure-repro/run-a/poker-blind-pressure-gentle100-shard-000.json
          blind-pressure-repro/run-b/poker-blind-pressure-gentle100-shard-000.json
          blind-pressure-repro/reproducibility-summary.json
      - if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: poker-blind-pressure-reproducibility
          path: blind-pressure-repro/
          if-no-files-found: warn
          retention-days: 30

  evaluate:
    needs: [plan, reproducibility]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run blind pressure candidate shard
        env:
          POKER_BLIND_PRESSURE: "1"
          POKER_BLIND_PRESSURE_POLICY: ${{ matrix.policy }}
          POKER_BLIND_PRESSURE_HANDS: ${{ needs.plan.outputs.hands }}
          POKER_BLIND_PRESSURE_SHARD: ${{ matrix.shard }}
          POKER_BLIND_PRESSURE_SHARD_COUNT: ${{ needs.plan.outputs.shard_count }}
          POKER_BLIND_PRESSURE_SEED_BASE: "26890246"
          POKER_BLIND_PRESSURE_OUTPUT_DIR: blind-pressure-results
        run: npx playwright test tests/e2e/poker-blind-pressure-v1.spec.js --project=chromium --retries=0
      - if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: blind-pressure-${{ matrix.policy }}-${{ matrix.shard }}
          path: blind-pressure-results/
          if-no-files-found: error
          retention-days: 14

  summarize:
    needs: [plan, evaluate]
    if: ${{ always() && needs.evaluate.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: blind-pressure-*
          path: blind-pressure-results
          merge-multiple: false
      - name: Evaluate blind pressure evidence
        run: node scripts/evaluate-poker-blind-pressure-v1.mjs blind-pressure-results blind-pressure-summary
      - uses: actions/upload-artifact@v7
        with:
          name: poker-blind-pressure-${{ needs.plan.outputs.stage }}-summary
          path: blind-pressure-summary/
          if-no-files-found: error
          retention-days: 30
