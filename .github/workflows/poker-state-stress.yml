name: Poker state stress

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: poker-state-stress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stress:
    name: natural betting stress (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install locked test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run 50-hand natural betting stress
        run: npm run test:state-stress

      - name: Upload Playwright stress report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: poker-state-stress-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
