name: Poker state stress

on:
  pull_request:
    paths:
      - "app.js"
      - "js/**"
      - "tests/e2e/natural-betting-state-stress.spec.js"
      - "tests/e2e/tournament-replacement-state-stress.spec.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/poker-state-stress.yml"
      - ".github/workflows/ai-long-run-telemetry.yml"
      - ".github/ai-long-run-triggers/**"
      - ".github/ai-long-run-stability-triggers/**"
  schedule:
    # GitHub cron uses UTC: Saturday 19:30 = Sunday 03:30 in Taiwan (UTC+8).
    - cron: "30 19 * * 6"

permissions:
  contents: read

concurrency:
  group: poker-state-stress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stress:
    name: state stress (${{ github.event_name == 'pull_request' && '25' || '100' }} hands + tournament replacements)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NATURAL_STRESS_HANDS: ${{ github.event_name == 'pull_request' && '25' || '100' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install locked test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run natural betting and tournament replacement stress
        run: >-
          npx playwright test
          tests/e2e/natural-betting-state-stress.spec.js
          tests/e2e/tournament-replacement-state-stress.spec.js
          --project=chromium --retries=0

      - name: Upload Playwright stress report
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: poker-state-stress-${{ github.run_id }}-${{ env.NATURAL_STRESS_HANDS }}-hands
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
