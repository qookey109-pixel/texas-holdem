name: Auth entry 720p integrate once

on:
  push:
    branches:
      - media/auth-entry-720p
    paths:
      - .github/workflows/auth-entry-upscale-once.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: media/auth-entry-720p
          fetch-depth: 0

      - name: Wire 720p asset into returning login
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          asset = Path('assets/auth-entry-poker-720p.mp4')
          assert asset.exists(), '720p asset missing'
          assert 2_000_000 < asset.stat().st_size < 4_000_000, asset.stat().st_size

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              assert count == expected, f'{path}: expected {expected} occurrences, found {count}: {old!r}'
              p.write_text(text.replace(old, new))

          replace_exact(
              'js/auth-entry-v2.js',
              'videoUrl: "assets/auth-entry-poker-trial.mp4?v=auth-entry-video-trial-v1",',
              'videoUrl: "assets/auth-entry-poker-720p.mp4?v=auth-entry-video-720p-v1",',
          )
          replace_exact(
              'js/auth-entry-v2.js',
              'version: "2.1.0-trial",',
              'version: "2.1.1-hd",',
          )
          replace_exact(
              'js/config.js',
              'authScript.src = "js/auth-entry-v2.js?v=auth-entry-video-crop-v2";',
              'authScript.src = "js/auth-entry-v2.js?v=auth-entry-video-720p-v1";',
          )

          test_path = Path('tests/e2e/auth-entry-v2.spec.js')
          test_text = test_path.read_text()
          test_text = test_text.replace('.toBe("2.1.0-trial");', '.toBe("2.1.1-hd");')
          test_text = test_text.replace('auth-entry-poker-trial', 'auth-entry-poker-720p')
          lines = test_text.splitlines()
          src_lines = 0
          for index, line in enumerate(lines):
              if 'toHaveAttribute("src"' in line and 'auth-entry-poker-720p' in line:
                  lines[index] = r'  await expect(video).toHaveAttribute("src", /assets\/auth-entry-poker-720p\.mp4\?v=auth-entry-video-720p-v1$/);'
                  src_lines += 1
          assert src_lines == 1, f'expected one video src assertion, found {src_lines}'
          test_text = '\n'.join(lines) + '\n'
          assert test_text.count('2.1.1-hd') == 3
          assert test_text.count('auth-entry-poker-720p') == 2
          assert 'auth-entry-video-720p-v1$/' in test_text
          test_path.write_text(test_text)

          manifest = Path('build-manifest.json')
          text = manifest.read_text()
          path_count = text.count('assets/auth-entry-poker-trial.mp4')
          assert path_count >= 1, f'build-manifest asset occurrence count: {path_count}'
          text = text.replace('assets/auth-entry-poker-trial.mp4', 'assets/auth-entry-poker-720p.mp4')
          text = text.replace('返回登入原始牌桌動畫試播影片', '返回登入 720p 清晰牌桌動畫')
          manifest.write_text(text)
          PY

          rm .github/workflows/auth-entry-upscale-once.yml

      - name: Commit integrated 720p version
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Use 720p auth entry video"
          git push origin HEAD:media/auth-entry-720p
