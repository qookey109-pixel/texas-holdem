name: Poker Economy Tail Floor

on:
  pull_request:
    paths:
      - ".github/workflows/poker-economy-tail-floor.yml"
      - "tests/e2e/poker-economy-tail-floor-v1.spec.js"
      - "tests/support/poker-economy-tail-floor-v1.js"
      - "scripts/evaluate-poker-economy-tail-floor-v1.mjs"
      - "scripts/check-poker-economy-repro-v1.mjs"
  workflow_dispatch:
    inputs:
      stage:
        description: Evidence stage
        required: true
        default: screen
        type: choice
        options: [screen, deep, evidence]

permissions:
  contents: read

concurrency:
  group: poker-economy-tail-floor-${{ github.ref }}-${{ inputs.stage || 'screen' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.plan.outputs.stage }}
      matrix: ${{ steps.plan.outputs.matrix }}
      hands: ${{ steps.plan.outputs.hands }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
    steps:
      - id: plan
        shell: bash
        run: |
          stage="${{ inputs.stage || 'screen' }}"
          case "$stage" in
            screen) hands=100; shards=2 ;;
            deep) hands=250; shards=4 ;;
            evidence) hands=1000; shards=10 ;;
            *) echo "Unknown stage: $stage" >&2; exit 1 ;;
          esac
          matrix=$(node -e '
            const policies = ["80-75", "tail5-floor20", "tail5-floor20-budgeted"];
            const shards = Number(process.argv[1]);
            const include = [];
            for (const policy of policies) for (let shard = 0; shard < shards; shard += 1) include.push({ policy, shard });
            process.stdout.write(JSON.stringify({ include }));
          ' "$shards")
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "hands=$hands" >> "$GITHUB_OUTPUT"
          echo "shard_count=$shards" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POKER_ECONOMY_TAIL_FLOOR: "1"
      POKER_ECONOMY_TAIL_FLOOR_POLICY: "80-75"
      POKER_ECONOMY_TAIL_FLOOR_STAGE: "reproducibility"
      POKER_ECONOMY_TAIL_FLOOR_HANDS: "100"
      POKER_ECONOMY_TAIL_FLOOR_SHARD: "0"
      POKER_ECONOMY_TAIL_FLOOR_SHARD_COUNT: "1"
      POKER_ECONOMY_TAIL_FLOOR_SEED_BASE: "26890246"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Replay A
        env:
          POKER_ECONOMY_TAIL_FLOOR_OUTPUT_DIR: economy-tail-floor-repro/run-a
        run: npx playwright test tests/e2e/poker-economy-tail-floor-v1.spec.js --project=chromium --retries=0
      - name: Replay B
        env:
          POKER_ECONOMY_TAIL_FLOOR_OUTPUT_DIR: economy-tail-floor-repro/run-b
        run: npx playwright test tests/e2e/poker-economy-tail-floor-v1.spec.js --project=chromium --retries=0
      - name: Compare deterministic fingerprints and economy telemetry
        run: >-
          node scripts/check-poker-economy-repro-v1.mjs
          economy-tail-floor-repro/run-a/poker-economy-ooda-80-75-shard-000.json
          economy-tail-floor-repro/run-b/poker-economy-ooda-80-75-shard-000.json
          economy-tail-floor-repro/reproducibility-summary.json
      - if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: poker-economy-tail-floor-reproducibility
          path: economy-tail-floor-repro/
          if-no-files-found: warn
          retention-days: 30

  evaluate:
    needs: [plan, reproducibility]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run tail-floor candidate shard
        env:
          POKER_ECONOMY_TAIL_FLOOR: "1"
          POKER_ECONOMY_TAIL_FLOOR_POLICY: ${{ matrix.policy }}
          POKER_ECONOMY_TAIL_FLOOR_STAGE: ${{ needs.plan.outputs.stage }}
          POKER_ECONOMY_TAIL_FLOOR_HANDS: ${{ needs.plan.outputs.hands }}
          POKER_ECONOMY_TAIL_FLOOR_SHARD: ${{ matrix.shard }}
          POKER_ECONOMY_TAIL_FLOOR_SHARD_COUNT: ${{ needs.plan.outputs.shard_count }}
          POKER_ECONOMY_TAIL_FLOOR_SEED_BASE: "26890246"
          POKER_ECONOMY_TAIL_FLOOR_OUTPUT_DIR: economy-tail-floor-results
        run: npx playwright test tests/e2e/poker-economy-tail-floor-v1.spec.js --project=chromium --retries=0
      - if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: economy-tail-floor-${{ matrix.policy }}-${{ matrix.shard }}
          path: economy-tail-floor-results/
          if-no-files-found: error
          retention-days: 14

  summarize:
    needs: [plan, evaluate]
    if: ${{ always() && needs.evaluate.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: economy-tail-floor-*
          path: economy-tail-floor-results
          merge-multiple: false
      - run: node scripts/evaluate-poker-economy-tail-floor-v1.mjs economy-tail-floor-results economy-tail-floor-summary
      - uses: actions/upload-artifact@v7
        with:
          name: poker-economy-tail-floor-${{ needs.plan.outputs.stage }}-summary
          path: economy-tail-floor-summary/
          if-no-files-found: error
          retention-days: 30
