name: AI Hero Gain Concentration Audit

on:
  pull_request:
    paths:
      - ".github/workflows/ai-hero-gain-concentration-audit.yml"
      - "tests/e2e/ai-hero-gain-concentration-audit-v1.spec.js"
      - "tests/support/ai-hero-gain-concentration-audit-v1.js"
      - "scripts/summarize-ai-hero-gain-concentration-audit-v1.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-hero-gain-concentration-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install locked test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run 250-hand Hero gain concentration audit shard
        env:
          AI_HERO_GAIN_AUDIT: "1"
          AI_HERO_GAIN_HANDS: "250"
          AI_HERO_GAIN_SHARD: ${{ matrix.shard }}
          AI_HERO_GAIN_SHARD_COUNT: "4"
          AI_HERO_GAIN_SEED_BASE: "26890246"
          AI_HERO_GAIN_OUTPUT_DIR: ai-hero-gain-results
        run: >-
          npx playwright test
          tests/e2e/ai-hero-gain-concentration-audit-v1.spec.js
          --project=chromium
          --retries=0

      - name: Upload Hero gain audit shard
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ai-hero-gain-audit-${{ matrix.shard }}
          path: ai-hero-gain-results/
          if-no-files-found: error
          retention-days: 30

  summarize:
    needs: audit
    if: ${{ always() && needs.audit.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download Hero gain audit shards
        uses: actions/download-artifact@v8
        with:
          pattern: ai-hero-gain-audit-*
          path: ai-hero-gain-results
          merge-multiple: false

      - name: Summarize Hero gain concentration
        run: node scripts/summarize-ai-hero-gain-concentration-audit-v1.mjs ai-hero-gain-results ai-hero-gain-summary

      - name: Upload Hero gain concentration summary
        uses: actions/upload-artifact@v7
        with:
          name: ai-hero-gain-concentration-audit-summary
          path: ai-hero-gain-summary/
          if-no-files-found: error
          retention-days: 30
