name: Repository health

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/gemini-worker/package-lock.json

      - name: Install pinned Worker toolchain
        run: npm --prefix backend/gemini-worker ci --ignore-scripts --no-audit --no-fund

      - name: Verify pinned Wrangler version
        run: |
          test "$(node -p "require('./backend/gemini-worker/package-lock.json').packages['node_modules/wrangler'].version")" = "4.36.0"
          test "$(node -p "require('./backend/gemini-worker/node_modules/wrangler/package.json').version")" = "4.36.0"
          backend/gemini-worker/node_modules/.bin/wrangler --version

      - name: Dry-run Worker bundle with pinned Wrangler
        working-directory: backend/gemini-worker
        run: npx --no-install wrangler deploy --dry-run --outdir .wrangler-dry-run

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/oci-gemini-function/requirements.txt

      - name: Check deployment parity script syntax
        run: node --check scripts/verify-live-static-parity.mjs

      - name: Verify core-game parity target contract
        run: node scripts/verify-live-static-parity.mjs --local-only

      - name: Install pinned OCI Gemini dependencies
        run: python -m pip install --disable-pip-version-check -r backend/oci-gemini-function/requirements.txt

      - name: Verify pinned OCI dependency imports and versions
        run: |
          python - <<'PY'
          from importlib.metadata import version
          expected = {
              "fdk": "0.1.117",
              "oci": "2.182.1",
              "requests": "2.34.2",
          }
          for package, wanted in expected.items():
              actual = version(package)
              assert actual == wanted, f"{package}: expected {wanted}, got {actual}"
              print(f"{package}=={actual}")
          import fdk  # noqa: F401
          import oci  # noqa: F401
          import requests  # noqa: F401
          PY

      - name: Check OCI Gemini Python syntax
        run: python -m py_compile backend/oci-gemini-function/func.py

      - name: Run OCI public observation contract
        run: python backend/oci-gemini-function/test_public_observation_contract.py

  deployed-static-parity:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: source-health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Allow GitHub Pages deployment to settle
        if: github.event_name == 'push'
        run: sleep 60

      - name: Verify deployed files match main
        run: >-
          node scripts/verify-live-static-parity.mjs
          --base-url https://qookey109-pixel.github.io/texas-holdem/
          --retries 12
          --retry-delay-ms 15000
