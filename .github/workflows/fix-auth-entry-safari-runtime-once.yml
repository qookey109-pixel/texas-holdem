name: Fix auth entry Safari runtime once

on:
  push:
    branches:
      - fix/auth-entry-safari-runtime-v2
    paths:
      - .tmp/auth-entry-safari-runtime/READY

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/auth-entry-safari-runtime-v2
          fetch-depth: 0

      - name: Apply Safari runtime patch
        run: python .tmp/auth-entry-safari-runtime/patch.py

      - name: Sanity-check patched JavaScript
        run: |
          node --check js/auth-entry-v2.js
          grep -q '2.1.3-safari-runtime' js/auth-entry-v2.js
          grep -q 'auth-entry-safari-runtime-v3' js/config.js
          grep -q 'auth-entry-safari-runtime-v3' index.html

      - name: Commit Safari runtime repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/auth-entry-v2.js js/auth-entry-video-trial.css js/config.js index.html tests/e2e/auth-entry-video-playback.spec.js
          git add -u .tmp/auth-entry-safari-runtime/READY || true
          git status --short
          git commit -m "Harden Safari returning-login video runtime"
          git push origin HEAD:fix/auth-entry-safari-runtime-v2
