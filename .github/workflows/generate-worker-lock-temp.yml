name: Generate Worker lockfile temp

on:
  push:
    branches:
      - chore/pin-worker-toolchain-v1-20260820

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/pin-worker-toolchain-v1-20260820

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate exact Worker lockfile
        working-directory: backend/gemini-worker
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify Wrangler lock resolution
        working-directory: backend/gemini-worker
        run: |
          test "$(node -p "require('./package-lock.json').packages['node_modules/wrangler'].version")" = "4.36.0"

      - name: Commit generated lockfile if needed
        run: |
          if git diff --quiet -- backend/gemini-worker/package-lock.json && git ls-files --error-unmatch backend/gemini-worker/package-lock.json >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/gemini-worker/package-lock.json
          git commit -m "Add locked Worker toolchain dependencies"
          git push origin HEAD:chore/pin-worker-toolchain-v1-20260820
