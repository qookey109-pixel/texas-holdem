name: Browser E2E

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - webkit

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install locked test dependencies
        run: npm ci

      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run all E2E scenarios on chromium
        if: ${{ matrix.browser == 'chromium' }}
        run: npx playwright test --project=chromium

      # Pull requests use a focused Safari/WebKit regression pack. The full
      # WebKit suite still runs after merge to main and on manual dispatch.
      - name: Run critical E2E scenarios on webkit
        if: ${{ matrix.browser == 'webkit' && github.event_name == 'pull_request' }}
        run: >-
          npx playwright test
          tests/e2e/poker-smoke.spec.js
          tests/e2e/poker-betting.spec.js
          tests/e2e/poker-settlement.spec.js
          tests/e2e/game-mode-controls-v2.spec.js
          tests/e2e/google-auth.spec.js
          tests/e2e/auth-entry-loader.spec.js
          tests/e2e/auth-entry-v2.spec.js
          tests/e2e/auth-entry-video-playback.spec.js
          tests/e2e/audio-mute-architecture-v1.spec.js
          tests/e2e/ai-opening-balance-v2-9-4.spec.js
          tests/e2e/ai-opening-balance-v2-9-5.spec.js
          tests/e2e/ai-provider-client.spec.js
          tests/e2e/layout-refresh-stability.spec.js
          tests/e2e/official-layout-migration.spec.js
          tests/e2e/desktop-accessibility.spec.js
          tests/e2e/topbar-account-layout.spec.js
          tests/e2e/topbar-seat-polish.spec.js
          tests/e2e/street-transition-performance.spec.js
          tests/e2e/hero-card-render-stability.spec.js
          tests/e2e/hole-card-motion-scope.spec.js
          tests/e2e/tournament-summary-layout.spec.js
          tests/e2e/ai-tiered-multiway-equity-v2-7.spec.js
          tests/e2e/ui-observer-idle.spec.js
          tests/e2e/mobile-v1-responsive.spec.js
          --project=webkit

      - name: Run all E2E scenarios on webkit
        if: ${{ matrix.browser == 'webkit' && github.event_name != 'pull_request' }}
        run: npx playwright test --project=webkit

      - name: Upload Playwright report
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
