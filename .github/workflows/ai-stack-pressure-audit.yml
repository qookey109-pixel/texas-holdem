name: AI Hero Stack Pressure Audit

on:
  pull_request:
    paths:
      - ".github/workflows/ai-stack-pressure-audit.yml"
      - "tests/e2e/ai-stack-pressure-audit-v1.spec.js"
      - "tests/support/ai-stack-pressure-audit-v1.js"
      - "scripts/summarize-ai-stack-pressure-audit-v1.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-stack-pressure-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install locked test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run 250-hand stack-pressure audit shard
        env:
          AI_STACK_PRESSURE_AUDIT: "1"
          AI_STACK_PRESSURE_HANDS: "250"
          AI_STACK_PRESSURE_SHARD: ${{ matrix.shard }}
          AI_STACK_PRESSURE_SHARD_COUNT: "4"
          AI_STACK_PRESSURE_SEED_BASE: "26890246"
          AI_STACK_PRESSURE_OUTPUT_DIR: ai-stack-pressure-results
        run: >-
          npx playwright test
          tests/e2e/ai-stack-pressure-audit-v1.spec.js
          --project=chromium
          --retries=0

      - name: Upload stack-pressure shard
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ai-stack-pressure-audit-${{ matrix.shard }}
          path: ai-stack-pressure-results/
          if-no-files-found: error
          retention-days: 30

  summarize:
    needs: audit
    if: ${{ always() && needs.audit.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download audit shards
        uses: actions/download-artifact@v8
        with:
          pattern: ai-stack-pressure-audit-*
          path: ai-stack-pressure-results
          merge-multiple: false

      - name: Summarize Hero stack pressure
        run: node scripts/summarize-ai-stack-pressure-audit-v1.mjs ai-stack-pressure-results ai-stack-pressure-summary

      - name: Upload stack-pressure summary
        uses: actions/upload-artifact@v7
        with:
          name: ai-stack-pressure-audit-summary
          path: ai-stack-pressure-summary/
          if-no-files-found: error
          retention-days: 30
