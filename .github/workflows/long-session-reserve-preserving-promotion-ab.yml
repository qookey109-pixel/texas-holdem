name: Long Session reserve-preserving promotion A/B

on:
  pull_request:
    paths:
      - "tests/e2e/long-session-balanced-pacing-evidence-v1.spec.js"
      - "tests/support/long-session-pacing-metrics-v1.js"
      - "js/long-session-mode-v1.js"
      - ".github/workflows/long-session-reserve-preserving-promotion-ab.yml"
  workflow_dispatch:
    inputs:
      hands:
        description: "Completed-hand opportunities per seed/variant"
        required: false
        default: "60"

permissions:
  contents: read

concurrency:
  group: long-session-reserve-preserving-promotion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LONG_SESSION_BALANCED_HANDS: ${{ inputs.hands || '60' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install locked test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Apply shared one-buy-in reserve
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'js/long-session-mode-v1.js';
          const source = fs.readFileSync(file, 'utf8');
          const needle = 'session = createSession({ tableIndex: 0, bankroll: 0, tableStack: TABLES[0].entry });';
          const replacement = 'session = createSession({ tableIndex: 0, bankroll: 2000, tableStack: TABLES[0].entry });';
          const matches = source.split(needle).length - 1;
          if (matches !== 1) throw new Error(`expected exactly one Long Session bankroll baseline, found ${matches}`);
          fs.writeFileSync(file, source.replace(needle, replacement));
          console.log('LONG_SESSION_PROMOTION_AB_SHARED_RESERVE bankroll=2000 tableStack=2000');
          NODE
          git diff --check

      - name: Prove reserve-only reproducibility
        shell: bash
        run: |
          for LABEL in a b; do
            echo "=== reserve-only repro / ${LABEL} ==="
            LONG_SESSION_BALANCED_SEED="1279545165" \
              npx playwright test \
              tests/e2e/long-session-balanced-pacing-evidence-v1.spec.js \
              --project=chromium \
              --retries=0 \
              --output="repro-results/reserve-only-${LABEL}"
          done
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const read = label => {
            const root = `repro-results/reserve-only-${label}`;
            const walk = dir => fs.readdirSync(dir, { withFileTypes: true }).flatMap(entry => entry.isDirectory() ? walk(path.join(dir, entry.name)) : [path.join(dir, entry.name)]);
            const file = walk(root).find(file => file.endsWith('long-session-balanced-pacing-evidence-v1.json'));
            if (!file) throw new Error(`missing reserve-only repro ${label}`);
            return JSON.parse(fs.readFileSync(file, 'utf8'));
          };
          const left = read('a');
          const right = read('b');
          const result = {
            sameFingerprint: left.deterministicFingerprint === right.deterministicFingerprint,
            samePacing: JSON.stringify(left.pacingHands) === JSON.stringify(right.pacingHands),
            sameActions: JSON.stringify(left.actionCounts) === JSON.stringify(right.actionCounts),
            leftFingerprint: left.deterministicFingerprint,
            rightFingerprint: right.deterministicFingerprint,
            initialBankroll: left.pacingHands?.[0]?.bankrollBefore,
          };
          console.log(`LONG_SESSION_PROMOTION_AB_RESERVE_REPRO ${JSON.stringify(result)}`);
          if (!result.sameFingerprint || !result.samePacing || !result.sameActions || result.initialBankroll !== 2000) process.exit(1);
          NODE

      - name: Run reserve-only matrix
        shell: bash
        run: |
          for SEED in 1279545165 1279545166 1279545167 1279545168 1279545169 1279545170 1279545171 1279545172; do
            echo "=== reserve-only seed=${SEED} ==="
            LONG_SESSION_BALANCED_SEED="$SEED" \
              npx playwright test \
              tests/e2e/long-session-balanced-pacing-evidence-v1.spec.js \
              --project=chromium \
              --retries=0 \
              --output="ab-results/reserve-only/seed-${SEED}"
          done

      - name: Prove accepted PR 203 reserve parity
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const walk = dir => fs.readdirSync(dir, { withFileTypes: true }).flatMap(entry => entry.isDirectory() ? walk(path.join(dir, entry.name)) : [path.join(dir, entry.name)]);
          const reports = walk('ab-results/reserve-only')
            .filter(file => file.endsWith('long-session-balanced-pacing-evidence-v1.json'))
            .map(file => JSON.parse(fs.readFileSync(file, 'utf8')))
            .sort((a, b) => a.seed - b.seed);
          if (reports.length !== 8) throw new Error(`expected 8 reserve-only reports, got ${reports.length}`);
          const aggregate = {
            seeds: reports.length,
            totalHandsCompleted: reports.reduce((sum, report) => sum + report.handsCompleted, 0),
            meanHandsCompleted: Number((reports.reduce((sum, report) => sum + report.handsCompleted, 0) / reports.length).toFixed(3)),
            sessionEndedSeeds: reports.filter(report => report.sessionEnded).length,
            movedUpSeeds: reports.filter(report => (report.pacing?.progression?.moveUps || 0) > 0).length,
            reachedT3Seeds: reports.filter(report => (report.pacing?.progression?.highestTableIndex || 0) >= 2).length,
            reentrySeeds: reports.filter(report => (report.pacing?.reentryFrequency || 0) > 0).length,
            meanExposure: Number((reports.reduce((sum, report) => sum + (report.pacing?.activeStackRisk?.meanExposedWealthRatio || 0), 0) / reports.length).toFixed(6)),
            failures: reports.reduce((sum, report) => sum + report.failures.length, 0),
            schedulerErrors: reports.reduce((sum, report) => sum + report.schedulerErrors.length, 0),
            allInitialBankroll2000: reports.every(report => report.pacingHands?.[0]?.bankrollBefore === 2000),
          };
          const accepted = {
            seeds: 8,
            totalHandsCompleted: 62,
            meanHandsCompleted: 7.75,
            sessionEndedSeeds: 8,
            movedUpSeeds: 6,
            reachedT3Seeds: 0,
            reentrySeeds: 3,
            meanExposure: 0.687782,
            failures: 0,
            schedulerErrors: 0,
            allInitialBankroll2000: true,
          };
          console.log(`LONG_SESSION_PROMOTION_AB_RESERVE_PARITY ${JSON.stringify({ accepted, actual: aggregate })}`);
          if (JSON.stringify(aggregate) !== JSON.stringify(accepted)) {
            throw new Error(`PR #203 reserve parity failed: ${JSON.stringify(aggregate)}`);
          }
          NODE

      - name: Apply ephemeral reserve-preserving promotion rule
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'js/long-session-mode-v1.js';
          const source = fs.readFileSync(file, 'utf8');
          const needle = 'if (observedTotalWealth >= candidate.entry) {';
          const replacement = 'if (observedTotalWealth >= candidate.entry * 2) {';
          const matches = source.split(needle).length - 1;
          if (matches !== 1) throw new Error(`expected exactly one Long Session promotion threshold, found ${matches}`);
          fs.writeFileSync(file, source.replace(needle, replacement));
          console.log('LONG_SESSION_PROMOTION_AB_EPHEMERAL_RULE nextTableEntryMultiplier=2');
          NODE
          git diff --check
          git diff -- js/long-session-mode-v1.js

      - name: Prove reserve-preserving reproducibility
        shell: bash
        run: |
          for LABEL in a b; do
            echo "=== reserve-preserving repro / ${LABEL} ==="
            LONG_SESSION_BALANCED_SEED="1279545165" \
              npx playwright test \
              tests/e2e/long-session-balanced-pacing-evidence-v1.spec.js \
              --project=chromium \
              --retries=0 \
              --output="repro-results/reserve-preserving-${LABEL}"
          done
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const read = label => {
            const root = `repro-results/reserve-preserving-${label}`;
            const walk = dir => fs.readdirSync(dir, { withFileTypes: true }).flatMap(entry => entry.isDirectory() ? walk(path.join(dir, entry.name)) : [path.join(dir, entry.name)]);
            const file = walk(root).find(file => file.endsWith('long-session-balanced-pacing-evidence-v1.json'));
            if (!file) throw new Error(`missing reserve-preserving repro ${label}`);
            return JSON.parse(fs.readFileSync(file, 'utf8'));
          };
          const left = read('a');
          const right = read('b');
          const result = {
            sameFingerprint: left.deterministicFingerprint === right.deterministicFingerprint,
            samePacing: JSON.stringify(left.pacingHands) === JSON.stringify(right.pacingHands),
            sameActions: JSON.stringify(left.actionCounts) === JSON.stringify(right.actionCounts),
            leftFingerprint: left.deterministicFingerprint,
            rightFingerprint: right.deterministicFingerprint,
            initialBankroll: left.pacingHands?.[0]?.bankrollBefore,
          };
          console.log(`LONG_SESSION_PROMOTION_AB_TREATMENT_REPRO ${JSON.stringify(result)}`);
          if (!result.sameFingerprint || !result.samePacing || !result.sameActions || result.initialBankroll !== 2000) process.exit(1);
          NODE

      - name: Run reserve-preserving matrix
        shell: bash
        run: |
          for SEED in 1279545165 1279545166 1279545167 1279545168 1279545169 1279545170 1279545171 1279545172; do
            echo "=== reserve-preserving seed=${SEED} ==="
            LONG_SESSION_BALANCED_SEED="$SEED" \
              npx playwright test \
              tests/e2e/long-session-balanced-pacing-evidence-v1.spec.js \
              --project=chromium \
              --retries=0 \
              --output="ab-results/reserve-preserving/seed-${SEED}"
          done

      - name: Print paired reserve-preserving evidence
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const walk = dir => fs.readdirSync(dir, { withFileTypes: true }).flatMap(entry => entry.isDirectory() ? walk(path.join(dir, entry.name)) : [path.join(dir, entry.name)]);
          const readGroup = variant => walk(`ab-results/${variant}`)
            .filter(file => file.endsWith('long-session-balanced-pacing-evidence-v1.json'))
            .map(file => JSON.parse(fs.readFileSync(file, 'utf8')))
            .sort((a, b) => a.seed - b.seed);
          const reserveOnly = readGroup('reserve-only');
          const reservePreserving = readGroup('reserve-preserving');
          if (reserveOnly.length !== 8 || reservePreserving.length !== 8) throw new Error(`expected 8+8 reports, got ${reserveOnly.length}+${reservePreserving.length}`);

          const aggregate = reports => ({
            seeds: reports.length,
            totalHandsCompleted: reports.reduce((sum, report) => sum + report.handsCompleted, 0),
            meanHandsCompleted: Number((reports.reduce((sum, report) => sum + report.handsCompleted, 0) / reports.length).toFixed(3)),
            sessionEndedSeeds: reports.filter(report => report.sessionEnded).length,
            movedUpSeeds: reports.filter(report => (report.pacing?.progression?.moveUps || 0) > 0).length,
            reachedT3Seeds: reports.filter(report => (report.pacing?.progression?.highestTableIndex || 0) >= 2).length,
            reachedFinalTableSeeds: reports.filter(report => report.pacing?.progression?.reachedFinalTable).length,
            reentrySeeds: reports.filter(report => (report.pacing?.reentryFrequency || 0) > 0).length,
            meanExposure: Number((reports.reduce((sum, report) => sum + (report.pacing?.activeStackRisk?.meanExposedWealthRatio || 0), 0) / reports.length).toFixed(6)),
            failures: reports.reduce((sum, report) => sum + report.failures.length, 0),
            schedulerErrors: reports.reduce((sum, report) => sum + report.schedulerErrors.length, 0),
          });

          const reserveViolations = [];
          for (const report of reservePreserving) {
            for (const hand of report.handReports || []) {
              if (hand.transition !== 'move-up') continue;
              const target = report.tables?.[hand.targetTableIndex];
              const threshold = (target?.entry || 0) * 2;
              if (!target || hand.expectedObservedWealth < threshold) {
                reserveViolations.push({ seed: report.seed, handNumber: hand.handNumber, targetTableIndex: hand.targetTableIndex, expectedObservedWealth: hand.expectedObservedWealth, threshold });
              }
            }
          }
          if (reserveViolations.length) throw new Error(`reserve-preserving promotion violation: ${JSON.stringify(reserveViolations)}`);

          for (const [variant, reports] of [['reserve-only', reserveOnly], ['reserve-preserving', reservePreserving]]) {
            for (const report of reports) {
              console.log(`LONG_SESSION_PROMOTION_AB_REPORT ${JSON.stringify({
                variant,
                seed: report.seed,
                fingerprint: report.deterministicFingerprint,
                handsCompleted: report.handsCompleted,
                sessionEnded: report.sessionEnded,
                heroBb100: report.pacing?.heroBb100,
                bustFrequency: report.pacing?.bustFrequency,
                reentryFrequency: report.pacing?.reentryFrequency,
                activeStackRisk: report.pacing?.activeStackRisk,
                progression: report.pacing?.progression,
                failures: report.failures,
                schedulerErrors: report.schedulerErrors,
              })}`);
            }
          }

          const left = aggregate(reserveOnly);
          const right = aggregate(reservePreserving);
          const paired = {
            reserveOnly: left,
            reservePreserving: right,
            deltaMeanHands: Number((right.meanHandsCompleted - left.meanHandsCompleted).toFixed(3)),
            deltaSessionEndedSeeds: right.sessionEndedSeeds - left.sessionEndedSeeds,
            deltaMovedUpSeeds: right.movedUpSeeds - left.movedUpSeeds,
            deltaReachedT3Seeds: right.reachedT3Seeds - left.reachedT3Seeds,
            deltaReentrySeeds: right.reentrySeeds - left.reentrySeeds,
            deltaMeanExposure: Number((right.meanExposure - left.meanExposure).toFixed(6)),
            reservePromotionViolations: reserveViolations.length,
          };
          console.log(`LONG_SESSION_PROMOTION_AB_AGGREGATE ${JSON.stringify(paired)}`);
          NODE

      - name: Upload reserve-preserving A/B evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: long-session-reserve-preserving-promotion-${{ github.run_id }}
          path: |
            repro-results/**/long-session-balanced-pacing-evidence-v1.json
            ab-results/**/long-session-balanced-pacing-evidence-v1.json
          if-no-files-found: error
          retention-days: 14
